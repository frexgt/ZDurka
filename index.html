<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rofl-City | Z-City</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --red-main: #ff0000;
            --red-dark: #440000;
            --red-glow: rgba(255, 0, 0, 0.4);
            --bg-black: #050000;
            --font-main: 'Disket Mono', 'Fira Code', monospace;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-black);
            font-family: var(--font-main);
            color: var(--red-main);
            text-transform: uppercase;
        }

        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
                        radial-gradient(circle, transparent 20%, rgba(0,0,0,0.7) 100%);
            background-size: 100% 4px, 100% 100%;
            z-index: 100;
            pointer-events: none;
        }

        #bg-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            filter: grayscale(1) brightness(0.3) sepia(1) hue-rotate(-50deg) blur(2px);
        }

        .bg-slide {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
            opacity: 0;
            transition: opacity 2s ease-in-out, transform 10s linear;
        }

        .bg-slide.active { 
            opacity: 0.5; 
            transform: scale(1.1);
        }

        .wrapper {
            position: relative;
            z-index: 110;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            width: 100%;
            padding: 0 10%;
        }

        .header-section {
            text-align: center;
            margin-bottom: 50px;
        }

        h1 {
            font-size: 4rem;
            margin: 0;
            letter-spacing: 10px;
            text-shadow: 0 0 20px var(--red-glow);
            animation: glitch 3s infinite;
        }

        .sub-header {
            font-size: 1rem;
            letter-spacing: 8px;
            color: var(--red-main);
            opacity: 0.6;
            margin-top: 10px;
        }

        .status-box {
            width: 100%;
            max-width: 700px;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid var(--red-main);
            padding: 40px;
            position: relative;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.1);
            text-align: center;
        }

        .status-box::before, .status-box::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            border: 4px solid var(--red-main);
        }
        .status-box::before { top: -6px; left: -6px; border-right: 0; border-bottom: 0; }
        .status-box::after { bottom: -6px; right: -6px; border-left: 0; border-top: 0; }

        #status-text {
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        #file-text {
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 30px;
            height: 1.2rem;
            overflow: hidden;
        }

        .scanner-wrap {
            width: 100%;
            height: 4px;
            background: var(--red-dark);
            position: relative;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .scanner-bar {
            width: 40%;
            height: 100%;
            background: var(--red-main);
            box-shadow: 0 0 15px var(--red-main);
            position: absolute;
            animation: scan 1.5s infinite ease-in-out;
        }

        @keyframes scan {
            0% { left: -45%; }
            100% { left: 100%; }
        }

        #tip-text {
            font-size: 0.9rem;
            color: var(--red-main);
            min-height: 3rem;
            max-width: 500px;
            margin: 0 auto;
            border-top: 1px solid var(--red-dark);
            padding-top: 20px;
            opacity: 0.8;
        }

        @keyframes glitch {
            0% { transform: skew(0deg); }
            1% { transform: skew(10deg); opacity: 0.5; }
            2% { transform: skew(-10deg); opacity: 1; }
            3% { transform: skew(0deg); }
            100% { transform: skew(0deg); }
        }
    </style>
</head>
<body>

    <div class="crt-overlay"></div>
    <div id="bg-container"></div>

    <div class="wrapper">
        <div class="header-section">
            <h1 id="title-text">&nbsp;</h1>
            <div class="sub-header">Establishing Neural Link...</div>
        </div>

        <div class="status-box">
            <div id="status-text">SYSTEM READY</div>
            <div id="file-text">Waiting for data packets...</div>
            
            <div class="scanner-wrap">
                <div class="scanner-bar"></div>
            </div>

            <div id="tip-text">...</div>
        </div>
        
        <div style="margin-top: 30px; font-size: 0.7rem; opacity: 0.4; letter-spacing: 3px;">
          Rofl-City
        </div>
    </div>

    <script>
        const backgroundImages = ["imag1.png", "imag2.png", "imag3.png", "imag5.png"];
        const tips = [
            "READ THE RULES OR FACE TERMINATION.",
            "SHINS ARE FRAGILE. AVOID HIGH DROPS.",
            "ADRENALINE IS FUEL. STRIKE TO RECOVER.",
            "RED CIRCLE = LIFE SUPPORT FAILURE.",
            "TRUST NO ONE. VERIFY ALL TARGETS.",
            "LOOT PROPS: HOLD E + RIGHT MOUSE BUTTON.",
            "Thanks Developer Z-City."
        ];

        const bgContainer = document.getElementById('bg-container');
        backgroundImages.forEach((src, i) => {
            const div = document.createElement('div');
            div.className = 'bg-slide' + (i === 0 ? ' active' : '');
            div.style.backgroundImage = `url('${src}')`;
            bgContainer.appendChild(div);
        });

        let currentSlide = 0;
        setInterval(() => {
            const slides = document.querySelectorAll('.bg-slide');
            if(slides.length > 0) {
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }
        }, 6000);

        const titleText = document.getElementById('title-text');
        const titles = ["Rofl-City", "Z-City"];
        let tIdx = 0, cIdx = 0, isDel = false;

        function type() {
            const full = titles[tIdx];
            if (!isDel) {
                titleText.innerText = full.substring(0, cIdx + 1);
                cIdx++;
                if (cIdx === full.length) setTimeout(() => isDel = true, 3000);
            } else {
                titleText.innerText = full.substring(0, cIdx - 1);
                cIdx--;
                if (cIdx === 0) {
                    isDel = false;
                    tIdx = (tIdx + 1) % titles.length;
                }
            }
            setTimeout(type, isDel ? 50 : 150);
        }
        type();

        function nextTip() {
            const el = document.getElementById('tip-text');
            if(el) {
                el.style.opacity = 0;
                setTimeout(() => {
                    el.innerText = "TIP: " + tips[Math.floor(Math.random() * tips.length)];
                    el.style.opacity = 1;
                }, 500);
            }
        }
        setInterval(nextTip, 5000);
        nextTip();

        function SetStatus(status) {
            const statusEl = document.getElementById('status-text');
            if(statusEl) statusEl.innerText = status.toUpperCase();
        }

        function DownloadingFile(fileName) {
            const fileEl = document.getElementById('file-text');
            if(fileEl) fileEl.innerText = "DOWNLOADING: " + fileName;
        }
    </script>
</body>
</html>
